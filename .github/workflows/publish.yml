# PUBLISHING THE CORDANGO PACKAGES TO NUGET.ORG, WITHOUT AN API KEY ANYWHERE.
#
# There is no secret holding a nuget.org key, and there is deliberately no place to put one. The job
# asks GitHub for a short-lived OIDC token, hands it to nuget.org, and gets back an API key that is
# valid for one hour and was minted for this run. Nothing to rotate, nothing to leak, and a stolen
# repository secret buys an attacker no publishing rights.
#
# THE OTHER HALF OF THIS FILE LIVES ON NUGET.ORG. A trusted publishing policy there names the
# repository owner, the repository, and THE FILE NAME OF THIS WORKFLOW. nuget.org will only exchange
# a token whose claims match that policy, which is why renaming this file breaks publishing until the
# policy is updated to match — the file name is part of the credential, not just a label.
#
#     Repository Owner:  cordango
#     Repository:        cordango
#     Workflow File:     publish.yml        <- this file's name, no path
#     Environment:       nuget              <- must equal the `environment:` below, or be left empty
#
# See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing.

name: Publish

# A TAG IS THE RELEASE. Pushing `v0.5.1-alpha` publishes 0.5.1-alpha and nothing else does; there is no manual
# trigger, because a button that publishes an arbitrary version to an immutable feed is a footgun.
# NuGet versions cannot be replaced or deleted, only unlisted, so the irreversible act is bound to
# the one thing that is already a permanent record.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # An approval gate, and the name nuget.org's policy may pin the token to. It only actually gates
    # once a required reviewer is configured under Settings -> Environments -> nuget; until then it
    # is just a name. Configure the reviewer — the point is that a compromised tag push still cannot
    # publish on its own.
    environment: nuget

    permissions:
      # Without this the OIDC token is never issued and NuGet/login has nothing to exchange. It is a
      # job-level grant on purpose: the top of the file drops everything to read, and only this job
      # gets the ability to prove who it is.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # THE TAG IS THE VERSION, and the csproj's <Version> is only a default for local builds. The
      # alternative — keeping the number in the csproj and tagging to match — has two sources of
      # truth and eventually publishes a version nobody meant.
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The extraction test the solution file promises: a plain clone, no database, no containers,
      # no platform. It runs BEFORE the push because a NuGet version is permanent — there is no
      # taking one back after the fact, only publishing another one.
      - name: Test
        run: dotnet test Cordango.slnx -c Release

      # TWO PACKAGES, ONE VERSION, ONE TAG.
      #
      #   Cordango.Cli         the `cordango` command, as a .NET tool
      #   Cordango.Standalone  the runtime a GENERATED application references
      #
      # And that is the whole set. The compiler, the generator SDK and the dotnet-vue generator are
      # NOT published: a .NET tool package contains its full publish output, so all three ship inside
      # Cordango.Cli as files and it declares no dependencies at all. `cordango` installs with
      # nothing else to restore.
      #
      # The two share a version because a generated application pins the runtime at the version of
      # the generator that wrote its project file. Publishing them apart would let somebody restore a
      # runtime the generator has never seen.
      #
      # Packing by name rather than packing the solution is belt and braces: Directory.Build.props
      # already turns packing off by default, and naming the two makes a third one impossible to add
      # by accident.
      - name: Pack
        run: |
          for project in Cordango.Standalone Cordango.Cli; do
            dotnet pack "src/$project/$project.csproj"               -c Release               -p:Version=${{ steps.version.outputs.version }}               -p:ContinuousIntegrationBuild=true               -o artifacts
          done

      # Immediately before the push, never earlier. The key expires in an hour and each OIDC token
      # buys exactly one key, so a login stranded behind a slow build is a login that has to be
      # redone rather than retried.
      - name: NuGet login (trusted publishing via OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: WeAreDotnet
      # The .snupkg beside it goes up in the same call. --skip-duplicate so re-running a job that
      # died between the two uploads finishes the release instead of failing on the half that landed.
      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # THE NODE RUNTIME, SAME TAG, SAME VERSION. A node-vue application pins @cordango/standalone at
  # the version of the generator that wrote its package.json — the same one-tag rule the NuGet pair
  # above lives by — so the npm package publishes from the same push.
  #
  # The dist-tag is EXPLICIT, both branches. `@cordango/web-controls` shipped prereleases under
  # `--tag alpha` with no workflow and npm's `latest` sat on a stale alpha while newer versions
  # shipped past it; spelling the tag out on every publish is the fix, not a preference.
  #
  # Like the NuGet job, there is no long-lived token: npmjs.com trusted publishing exchanges this
  # run's OIDC token. The policy on npmjs.com names this repository and THIS FILE NAME, so renaming
  # the workflow breaks publishing until the policy is updated to match.
  publish-npm:
    runs-on: ubuntu-latest

    environment: npm

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The fixture suites are the contract with the C# runtime, and an npm version is as permanent
      # as a NuGet one: test before publishing, never after.
      - name: Build and test
        working-directory: src/Cordango.Standalone.Node
        run: |
          npm ci --no-audit --no-fund
          npm run check

      # The checked-in version is 0.0.0 on purpose — the tag is the version, same as the csproj's
      # <Version> being only a local default.
      - name: Stamp the version
        working-directory: src/Cordango.Standalone.Node
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Publish
        working-directory: src/Cordango.Standalone.Node
        run: |
          case "${{ steps.version.outputs.version }}" in
            *-*) tag=alpha ;;
            *)   tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"
